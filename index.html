<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RBURGER - Elegant Burger Builder</title>
    <link href="https://fonts.cdnfonts.com/css/g-good-food" rel="stylesheet" />
    <link rel="icon" type="image/png" href="img/logo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <header>
        <h1 class="fs-1 fw-bold">RBURGER</h1>
        <p class="mt-n2 fw-light fs-3">Elegant Burger Builder</p>
        <p class="fs-5">Create your own style burger🍔!</p>
      </header>

      <div class="container">
        <div class="block">
          <button class="btn-reset" onclick="resetBurger()">RESET</button>
          <div class="block-header">
            <h2 class="fs-5 m-0 p-0">RETURN</h2>
          </div>
          <div
            class="drop-zone"
            ondrop="dropToDelete(event)"
            ondragover="allowDrop(event)"
          >
            DRAG HERE TO RETURN INGREDIENTS
          </div>
        </div>

        <div class="block">
          <div class="block-header"><h2 class="fs-5 m-0 p-0">ORDER</h2></div>
          <p
            style="
              text-align: center;
              font-weight: bold;
              color: #555;
              margin: 10px 0;
            "
          >
            Assemble Your Gourmet Burger Below <br />
            <small style="color: #999; font-size: smaller; font-weight: 100">
              Double click to reset specific ingredients</small
            >
          </p>

          <div
            id="burger-area"
            ondrop="dropToStack(event)"
            ondragover="allowDrop(event)"
          ></div>
          <button class="btn-order" onclick="submitOrder()">ORDER</button>
        </div>

        <div class="block" style="width: 100%">
          <div class="block-header">
            <h2 class="fs-5 m-0 p-0">INGREDIENTS</h2>
          </div>
          <div class="slide-container">
            <button class="nav-btn" onclick="changeSlide(-1)">❮</button>
            <div
              id="current-ing"
              draggable="true"
              ondragstart="dragNew(event)"
            ></div>
            <button class="nav-btn" onclick="changeSlide(1)">❯</button>
          </div>
          <small class="small-desc text-center">Tap 2x to order or drag</small>
        </div>

        <div class="block">
          <div class="block-header">
            <h2 class="fs-5 m-0 p-0">DETAIL ORDER</h2>
          </div>
          <div id="detail-view"></div>
        </div>
      </div>
    </main>

    <footer>
      Made with ❤️ by
      <a href="https://github.com/RenaldyNaufalTA" target="_blank">Renaldy</a>
    </footer>

    <script src="item.js"></script>
    <script src="script.js"></script>
  </body>
</html>
