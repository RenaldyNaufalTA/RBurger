<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <title>Order Summary - RBurger</title>
    <link href="https://fonts.cdnfonts.com/css/g-good-food" rel="stylesheet" />
    <link rel="icon" type="image/png" href="img/logo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <header>
        <h1 class="fs-1 fw-bold">RBURGER</h1>
        <p class="mt-n2 fw-light fs-3">Elegant Burger Builder</p>
        <p class="fs-5">Enjoy your burger😉!</p>
      </header>

      <div class="container" id="container-order">
        <div class="block order-block">
          <div class="block-header">
            <h2 class="fs-5 m-0 p-0">YOUR BURGER</h2>
          </div>
          <div id="burger-display" class="burger-display"></div>
        </div>

        <div class="block order-block">
          <div class="block-header">
            <h2 class="fs-5 m-0 p-0">ORDER DETAILS</h2>
          </div>
          <div id="order-details"></div>
          <button class="btn-back" onclick="goBack()">BACK TO MENU</button>
        </div>
      </div>
    </main>

    <footer>
      Made with ❤️ by
      <a href="https://github.com/RenaldyNaufalTA" target="_blank">Renaldy</a>
    </footer>

    <script src="item.js"></script>
    <script>
      function displayOrder() {
        const orderData = JSON.parse(localStorage.getItem("burgerOrder"));
        if (!orderData) {
          document.getElementById("order-details").innerHTML =
            "<p>No order found.</p>";
          return;
        }

        // Display burger
        const burgerDiv = document.getElementById("burger-display");
        let html = "";
        let zIndex = 1;

        // Bottom bun
        const bottom = ingredients.find((i) => i.id === 1);
        html += `<img class="layer" src="${bottom.image}" alt="${
          bottom.name
        }" style="object-fit: contain; width: 160px; height: 25px; z-index: ${zIndex++}; margin-top: -10px;" />`;

        // Addons
        orderData.components.forEach((component) => {
          html += `<img class="layer" src="${component.image}" alt="${
            component.name
          }" style="object-fit: contain; width: 160px; height: 25px; z-index: ${zIndex++}; margin: -10px 0;" />`;
        });

        // Top bun
        const top = ingredients.find((i) => i.id === 7);
        html += `<img class="layer" src="${top.image}" alt="${top.name}" style="object-fit: contain; width: 160px; height: 35px; z-index: 99999; margin-bottom: -7px;" />`;

        burgerDiv.innerHTML = html;

        // Display details
        const detailsDiv = document.getElementById("order-details");
        let rows = `<tr><td>Bottom Bread</td><td>$1</td></tr>`;

        orderData.components.forEach((component) => {
          rows += `<tr><td>${component.name}</td><td>$${component.price}</td></tr>`;
        });

        rows += `<tr><td>Top Bread</td><td>$1</td></tr>`;
        detailsDiv.innerHTML = `<table>${rows}<tr class="total-row"><td>TOTAL</td><td>$${orderData.totalPrice}</td></tr></table>`;
      }

      function goBack() {
        window.location.href = "index.html";
      }

      window.onload = displayOrder;
    </script>
  </body>
</html>
